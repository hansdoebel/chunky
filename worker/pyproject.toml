[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunky-worker"
version = "0.1.0"
description = "FastAPI worker that runs Docling, chunking, and optional embeddings on Linux."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.163.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "python-multipart==0.0.33",
  "pydantic==2.14.3",
  "qdrant-client==1.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
]
docling = [
  "docling==2.150.1",
  "docling-core==2.107.0",
  "docling-ibm-models==4.0.4",
  "transformers==5.23.0",
  "torch==2.15.0",
]

[project.scripts]
chunky-worker = "chunky_worker.__main__:main"

[tool.setuptools.packages.find]
include = ["chunky_worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
