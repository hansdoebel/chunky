name: macOS script dependencies

on:
  pull_request:
    paths:
      - 'requirements/macos-scripts.txt'
      - '.github/workflows/macos-script-dependencies.yml'
  push:
    branches: [main]
    paths:
      - 'requirements/macos-scripts.txt'
      - '.github/workflows/macos-script-dependencies.yml'

concurrency:
  group: macos-script-dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  imports:
    name: Install and import Mac script dependencies
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/macos-scripts.txt
      - name: Check Apple Silicon interpreter
        run: python -c "import platform; assert platform.system() == 'Darwin' and platform.machine() == 'arm64'"
      - name: Install pinned Mac dependencies
        run: |
          python -m venv "$RUNNER_TEMP/chunky-script-dependencies"
          "$RUNNER_TEMP/chunky-script-dependencies/bin/python" -m pip install -r requirements/macos-scripts.txt
          "$RUNNER_TEMP/chunky-script-dependencies/bin/python" -m pip check
      - name: Import runtimes without model downloads
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          "$RUNNER_TEMP/chunky-script-dependencies/bin/python" -c "import docling, docling_core, fastembed, mlx_vlm, torch; from docling.document_converter import DocumentConverter"
