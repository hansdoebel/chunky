# CI for Chunky.
#
# Python is pinned to 3.12 (worker requires >=3.11). The script integration
# suite (test_docling_integration) needs Docling and is not run here.
#
# macOS deployment target is 26.2 (MACOSX_DEPLOYMENT_TARGET in the Xcode
# project, created with Xcode 26.2). The macos-26 runner ships Xcode 26.2
# through 26.6; this job selects 26.2 so the SDK matches that target.
# Codesigning is disabled. UI tests launch the GUI app and are excluded;
# ChunkyTests is the unit-test bundle. qdrant-swift integration tests need
# a live Qdrant and are skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker (test extras only)
        run: python -m pip install -e "./worker[dev]"

      - name: Worker unit tests
        run: python -m pytest -q worker

      - name: Docling convert helper unit tests
        working-directory: Chunky/Resources/Scripts
        run: python -m unittest test_docling_convert -v

  macos:
    name: macOS build and unit tests (Xcode 26.2)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Build and run ChunkyTests
        run: |
          xcodebuild test \
            -project Chunky.xcodeproj \
            -scheme Chunky \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:ChunkyTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Build qdrant-swift and run its unit tests
        working-directory: LocalPackages/qdrant-swift
        run: swift test --skip IntegrationTests
