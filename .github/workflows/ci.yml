# CI for Chunky.
#
# Python is pinned to 3.12. The script integration suite
# (test_docling_integration) needs Docling and is not run here.
#
# macOS deployment target is 27.0. The xcode-27 runner (GA 2026-10-15)
# includes Xcode 27.2 (build 27B52, SDK macosx27.2). Codesigning is disabled.
# UI tests launch the GUI app and are excluded; ChunkyTests is the unit-test
# bundle. qdrant-swift integration tests need a live Qdrant and are skipped.
#
# macOS minutes: the xcode-27 job is skipped when a push or pull request only
# touches Python, worker, or docs paths. Skipping is a job-level `if`, so the
# check still reports and branch protection treats it as success. The workflow
# itself always runs (no workflow-level path filter). The vendored qdrant-swift
# `swift test` runs only when that package or a workflow file changes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel the in-progress run for the same pull request, or for the same ref
# on push (main). A new commit should not keep the previous xcode-27 job.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
      qdrant: ${{ steps.filter.outputs.qdrant }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Push diffs against the commit before the push. Full history keeps
          # that parent available when several commits land at once.
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # pull_request ignores base and lists the PR files via the API.
          # push to this ref diffs github.event.before..HEAD, the commits
          # just pushed, not the merge-base with the default branch.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          predicate-quantifier: some-with-excludes
          filters: |
            macos:
              - '**'
              - '!worker/**'
              - '!Chunky/Resources/Scripts/**'
              - '!docs/**'
              - '!*.md'
              - '!requirements/**'
              - '!pyrightconfig.json'
            qdrant:
              - 'LocalPackages/qdrant-swift/**'
              - '.github/workflows/**'

  python:
    name: Python tests (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker (test extras only)
        run: python -m pip install -e "./worker[dev]"

      - name: Worker unit tests
        run: python -m pytest -q worker

      - name: Docling convert helper unit tests
        working-directory: Chunky/Resources/Scripts
        run: python -m unittest test_docling_convert test_fastembed_daemon -v

  macos:
    name: macOS build and unit tests (Xcode 27.2)
    needs: changes
    # Skip only when the filter explicitly reports no macOS-relevant files.
    # A failed or empty filter still runs the job, so a broken change
    # detector cannot waive the tests. !cancelled() replaces the default
    # success() gate: a concurrency cancel does not start xcode-27, and a
    # failed changes job does not skip this one. A skipped job reports
    # success, so a required check of this name still passes.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.macos != 'false') }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Build and run ChunkyTests
        run: |
          rm -rf /tmp/chunky-chat-settings-screenshots /tmp/chunky-verification-screenshots /tmp/chunky-bibliography-screenshots /tmp/chunky-citation-screenshots /tmp/chunky-health-screenshots /tmp/chunky-watched-folder-screenshots
          mkdir -p /tmp/chunky-chat-settings-screenshots /tmp/chunky-verification-screenshots /tmp/chunky-bibliography-screenshots /tmp/chunky-citation-screenshots /tmp/chunky-health-screenshots /tmp/chunky-watched-folder-screenshots
          xcodebuild test \
            -project Chunky.xcodeproj \
            -scheme Chunky \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:ChunkyTests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Upload analytics screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-screenshot
          path: /tmp/chunky-*.png
          if-no-files-found: ignore

      - name: Build qdrant-swift and run its unit tests
        # Same fail-open rule as the job: skip only on an explicit false.
        if: ${{ needs.changes.outputs.qdrant != 'false' }}
        working-directory: LocalPackages/qdrant-swift
        run: swift test --skip IntegrationTests

      - name: Stage chat settings screenshots
        if: always()
        run: |
          mkdir -p chat-screenshots
          cp -f /tmp/chunky-chat-settings-screenshots/*.png chat-screenshots/ || true
          ls -la chat-screenshots

      - name: Upload chat settings screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-settings-screenshots
          path: chat-screenshots/*.png
          if-no-files-found: error

      - name: Stage verification screenshots
        if: always()
        run: |
          mkdir -p verification-screenshots
          cp -f /tmp/chunky-verification-screenshots/*.png verification-screenshots/ || true
          ls -la verification-screenshots

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-screenshots
          path: verification-screenshots/*.png
          if-no-files-found: error

      - name: Stage bibliography screenshots
        if: always()
        run: |
          mkdir -p bibliography-screenshots
          cp -f /tmp/chunky-bibliography-screenshots/*.png bibliography-screenshots/ || true
          ls -la bibliography-screenshots

      - name: Upload bibliography screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bibliography-screenshots
          path: bibliography-screenshots/*.png
          if-no-files-found: error

      - name: Stage citation screenshots
        if: always()
        run: |
          mkdir -p citation-screenshots
          cp -f /tmp/chunky-citation-screenshots/*.png citation-screenshots/ || true
          ls -la citation-screenshots

      - name: Upload citation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-screenshots
          path: citation-screenshots/*.png
          if-no-files-found: error

      - name: Stage health screenshots
        if: always()
        run: |
          mkdir -p health-screenshots
          cp -f /tmp/chunky-health-screenshots/*.png health-screenshots/ || true
          ls -la health-screenshots

      - name: Upload health screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-screenshots
          path: health-screenshots/*.png
          if-no-files-found: error

      - name: Stage watched folder screenshots
        if: always()
        run: |
          mkdir -p watched-folder-screenshots
          cp -f /tmp/chunky-watched-folder-screenshots/*.png watched-folder-screenshots/ || true
          ls -la watched-folder-screenshots

      - name: Upload watched folder screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watched-folder-screenshots
          path: watched-folder-screenshots/*.png
          if-no-files-found: error
